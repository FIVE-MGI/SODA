name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            web/SpatialViewer/requirements.txt
            web/SpatialViewer/requirements-clustering.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax-check the JavaScript
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r web/SpatialViewer/requirements.txt -r web/SpatialViewer/requirements-clustering.txt
          pip freeze

      - name: Smoke test (synthetic demo -> prepare -> export -> checks)
        run: python tests/smoke_test.py

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            demo/smoke_test.log
            demo/smoke_test_summary.json
