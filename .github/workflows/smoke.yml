name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/SpatialViewer/requirements-lock.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax-check the JavaScript
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      # The same one-command install users run: makes .venv and installs the pinned
      # versions in requirements-lock.txt, so the lock file is tested on Linux too.
      - name: Install (install.sh, from the lock file)
        run: |
          bash install.sh --python "$(command -v python)"
          .venv/bin/python -m pip freeze

      - name: Smoke test (synthetic demo -> prepare -> export -> checks)
        run: .venv/bin/python tests/smoke_test.py

      # The desktop app's launcher from source (app/soda_app.py, about 6 minutes): selftest, the python
      # stand-in, Prepare on the demo data with the sample ID check as a gate, Check, the viewer server
      # (Range, refused paths and Host headers, the app's config.js) and the home page's API. No browser
      # opens (the test sets SODA_NO_BROWSER). Runs even if the smoke test failed, so both results show.
      - name: Desktop app test (tests/app_test.py, from source)
        if: success() || failure()
        run: .venv/bin/python tests/app_test.py --work "$RUNNER_TEMP/app-test"

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            demo/smoke_test.log
            demo/smoke_test_summary.json
            ${{ runner.temp }}/app-test/app_test.log
