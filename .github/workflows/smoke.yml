name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/SpatialViewer/requirements-lock.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax-check the JavaScript
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      # The same one-command install users run: makes .venv and installs the pinned
      # versions in requirements-lock.txt, so the lock file is tested on Linux too.
      - name: Install (install.sh, from the lock file)
        run: |
          bash install.sh --python "$(command -v python)"
          .venv/bin/python -m pip freeze

      - name: Smoke test (synthetic demo -> prepare -> export -> checks)
        run: .venv/bin/python tests/smoke_test.py

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            demo/smoke_test.log
            demo/smoke_test_summary.json
